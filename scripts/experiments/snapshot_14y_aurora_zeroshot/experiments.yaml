# =========================================================================
# snapshot_14y_aurora_zeroshot — paper §3.3.3 P1
# "Aurora forecast as coarse-grid context" (zero-shot)
# =========================================================================
# Each config is TRAINED on the ERA5 dataset (dataset_timestamp_global) with
# precipitation dropped (--drop-context-channels total_precipitation_sum ->
# 19-channel context), then evaluated ZERO-SHOT on:
#   * ERA5 test split          (eval_era5/)        — in-distribution reference
#   * Aurora forecast leads     (eval_aurora_lead{6,24,72}h/)
# The trained model never sees Aurora; the only thing that changes at test
# time is the coarse-grid context source. See submit.sh for the matrix
# (these 6 configs x {europe, east_asia} x seeds {42,123,456}, each with the
# 4 evals above).
#
# extra_args are verbatim from snapshot_14y_australia/experiments.yaml. The
# TESSERA configs use the RAW 16-d VAE latent concatenated directly (no
# projection head). ${VAE_LATENTS_PATH}/${VAE_LATENTS_CSV} are expanded from
# the environment by submit.sh.
#
# Heads / losses:
#   * t2m  -> Gaussian, NLL
#   * wind -> Truncated-Normal, with one NLL variant and one CRPS variant
# Each TESSERA config is paired with its no-TESSERA bilinear baseline.

# ---- t2m (Gaussian, NLL) ----

- name: t2m_snap_vae_lat16_concat_with_elev_no_static_wd
  label: "t2m snap VAE-lat16 concat (with elev, no static, wd=1e-4)"
  colour: "#1f77b4"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --weight-decay 1e-4"

- name: t2m_snap_bilinear_baseline_wd
  label: "t2m snap bilinear baseline (no TESSERA, wd=1e-4)"
  colour: "#999999"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --weight-decay 1e-4"

# ---- t2m (Gaussian, CRPS) ----

- name: t2m_snap_vae_lat16_concat_with_elev_no_static_wd_crps
  label: "t2m snap VAE-lat16 concat (with elev, no static, wd=1e-4) - CRPS-loss"
  colour: "#1f77b4"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --weight-decay 1e-4 --loss-function crps"

- name: t2m_snap_bilinear_baseline_wd_crps
  label: "t2m snap bilinear baseline (no TESSERA, wd=1e-4) - CRPS-loss"
  colour: "#999999"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --weight-decay 1e-4 --loss-function crps"

# ---- wind (Truncated-Normal, NLL) ----

- name: wind_truncnormal_snap_vae_lat16_concat_with_elev_no_static_wd
  label: "Wind (TruncNormal) snap VAE-lat16 concat (with elev, no static, wd=1e-4)"
  colour: "#1f77b4"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --weight-decay 1e-4 --likelihood wind=truncated_normal"

- name: wind_truncnormal_snap_bilinear_baseline_wd
  label: "Wind (TruncNormal) snap bilinear baseline (no TESSERA, wd=1e-4)"
  colour: "#999999"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --weight-decay 1e-4 --likelihood wind=truncated_normal"

# ---- wind (Truncated-Normal, CRPS) ----

- name: wind_truncnormal_snap_vae_lat16_concat_with_elev_no_static_wd_crps
  label: "Wind (TruncNormal) snap VAE-lat16 concat (with elev, no static, wd=1e-4) - CRPS-loss"
  colour: "#1f77b4"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --weight-decay 1e-4 --likelihood wind=truncated_normal --loss-function crps"

- name: wind_truncnormal_snap_bilinear_baseline_wd_crps
  label: "Wind (TruncNormal) snap bilinear baseline (no TESSERA, wd=1e-4) - CRPS-loss"
  colour: "#999999"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --weight-decay 1e-4 --likelihood wind=truncated_normal --loss-function crps"

