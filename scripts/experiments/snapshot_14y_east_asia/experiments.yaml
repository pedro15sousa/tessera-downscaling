# snapshot_14y_east_asia experiments
#
# Single-region snapshot-cadence experiments for East Asia.
# Companion output dir: training_runs_snapshot_14y_east_asia.
# Dataset region: east_asia
#
# -----------------------------------------------------------------------
# SIBLING FILES — keep the 28-config matrix in sync with:
#
#   projects/tessera_downscaling/scripts/experiments/snapshot_14y_eu/experiments.yaml
#   projects/tessera_downscaling/scripts/experiments/snapshot_14y_us/experiments.yaml
#   projects/tessera_downscaling/scripts/experiments/snapshot_14y_australia/experiments.yaml
#   projects/tessera_downscaling/scripts/experiments/snapshot_14y_southern_africa/experiments.yaml
#   projects/tessera_downscaling/scripts/experiments/snapshot_6y_eu/experiments.yaml
#
# Edits to the 28-config matrix below should also be applied
# to every sibling, since they all run the same matrix and
# any divergence should be deliberate and documented.
# -----------------------------------------------------------------------
#
# Scope: full architecture matrix crossing:
#   * latent_dim ∈ {16, 64}
#   * projection_dim ∈ {direct, 8, 16, 32}  (lat16 only with direct or proj8;
#                                            projecting to ≥latent_dim has no compression)
#   * projection_style ∈ {linear, MLP}      (only when projection_dim > 0)
#   * injection ∈ {concat, FiLM}
#   * elev ∈ {with, no}
#   * target ∈ {t2m, wind}                  (single-task)
#                                           OR [t2m, wind] (multi-task, joint)
#
# Plus a single-task and a multi-task bilinear baseline (no TESSERA, with elev,
# with static fields), and a static-fields ablation on the top-3 winning
# architectures (lat16 concat, lat64 proj16 concat, lat64 proj8 FiLM) with
# --static-fields ON, both elev settings, both single-task and multi-task.
#
# Totals:
#   - 2 single-task baselines
#   - 80 single-task VAE configs (main matrix, no-static)
#   - 12 single-task VAE configs (static-fields ablation)
#   - 1 multi-task baseline
#   - 40 multi-task VAE configs (main matrix, no-static)
#   - 6 multi-task VAE configs (static-fields ablation)
#   = 141 configs × 3 seeds = 423 jobs.
#
# Every entry specifies `extra_args` as it would be passed to train.py
# (same shape as the original submit_snapshot_experiments.sh entries).
# The submit script expands VAE_LATENTS_PATH / VAE_LATENTS_PATH_LAT64 /
# VAE_LATENTS_CSV via env-var substitution at submit time.
#
# Fields consumed by the submit script:
#   name, target_variables, extra_args
# Fields consumed by the notebook (future migration):
#   name, label, colour, target_variables

# =========================================================================
# Single-task baselines (no TESSERA, with static)
# =========================================================================


- name: wind_snap_bilinear_baseline_wd
  label: "Wind snap bilinear baseline (with elev, with static, wd=1e-4)"
  colour: "#999999"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --weight-decay 1e-4"


- name: t2m_snap_bilinear_baseline_wd
  label: "t2m snap bilinear baseline (with elev, with static, wd=1e-4)"
  colour: "#999999"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --weight-decay 1e-4"


