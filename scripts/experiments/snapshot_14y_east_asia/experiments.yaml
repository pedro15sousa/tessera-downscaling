# =========================================================================
# EXTRA DESCRIPTORS — hand-crafted surface/topography descriptors after
# Bakketun et al. 2026 (arXiv:2607.02824), added 2026-07-22. 17 dims:
# WorldCover land-cover fractions, canopy height, SoilGrids clay/sand over
# the 640 m TESSERA patch footprint + GLO-30 elevation stats / slope /
# directional derivatives over the paper's 12.5 km kernel. Two questions,
# each asked against the shortlisted main variants:
#   1. baseline + extradesc — do hand-crafted descriptors recover (part of)
#      the TESSERA gain? (learned vs hand-crafted representation)
#   2. TESSERA + extradesc — are they complementary? That arm lives in the
#      sibling snapshot_14y_<region>_tessera_1B-M_2017 folder, on the
#      shortlisted crop64_lat16_auxon latents (decided 2026-07-26), next to
#      its pure-TESSERA parent. Only the baseline-side arms live here.
# Baseline arm keeps static fields (mirrors its parent baseline); TESSERA
# arm drops them (mirrors its parent). Both keep elev + mTPI + wd=1e-4.
# =========================================================================

- name: t2m_snap_bilinear_baseline_mtpi_extradesc_wd
  label: "t2m snap bilinear baseline + extra descriptors (with elev + mTPI, with static, wd=1e-4)"
  colour: "#8c564b"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --extra-descriptors-path ${EXTRA_DESCRIPTORS_PATH} --extra-descriptors-station-csv ${VAE_LATENTS_CSV} --extra-descriptors-drop-prob 0.0 --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_bilinear_baseline_mtpi_extradesc_wd
