# =========================================================================
# LATENT DROPOUT SWEEP — regularisation probe on the headline +mTPI
# lat16-direct-concat models (added 2026-06-29). Full-embedding dropout on
# the precomputed VAE latents (--vae-latents-drop-prob > 0) = randomly
# ablating the TESSERA pathway for a fraction of stations per step, with
# 1/(1-p) variance correction. NOT an OOD-latent test: under z-scoring the
# zeroed vector == the population mean (in-distribution), so the model can't
# learn a distinct "latent-unavailable" mode. Tests whether penalising
# latent over-reliance helps sparse-region overfitting (SA/Australia t2m
# still <= ERA5-interp). drop in {0.10, 0.25}; p=0.0 twins exist above.
# Deliberate divergence from the non-sparse sibling matrices.
# +4 configs x 3 seeds = +12 jobs.
# =========================================================================

- name: t2m_snap_vae_lat16_concat_with_elev_mtpi_no_static_drop10_wd
  label: "t2m snap VAE-lat16 concat (with elev + mTPI, no static, wd=1e-4) — latent-drop 0.10"
  colour: "#c5b0d5"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.10 --no-static-fields --use-mtpi --weight-decay 1e-4"

