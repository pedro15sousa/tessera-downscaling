# =============================================================================
# East_asia mechanism sweep — selective replication of the EU14y matrix to test
# whether the canonical recipe and its hypotheses transfer to a sparse-station
# region. Three core questions:
#   Q1. Does concat + attention beat concat-alone in a sparse region?
#   Q2. Does the projection-gradient hypothesis hold (attention's marginal
#       gain vanishes / reverses when there's no projection to train)?
#   Q3. Does kernel-conditioning add on top of attention here, given fewer
#       landscape regimes per batch?
# Standalone kc and embed-stream rows are kept so we can compare those single
# mechanisms against the canonical recipe in the same region.
# =============================================================================


# -------- A0: Baseline (no TESSERA) --------
# These should already exist in the yaml — left here for orientation.
# - wind_snap_setconv_baseline_with_elev_no_static_wd
# - t2m_snap_setconv_baseline_with_elev_no_static_wd


# -------- A1: lat16 (no projection) — projection-gradient hypothesis (Q2) --------
# Without a projection layer, attention has nothing extra to gradient-train via
# batch coupling. If EU's pattern holds (attention's gain over concat vanishes
# or reverses), this confirms the projection-gradient story.

