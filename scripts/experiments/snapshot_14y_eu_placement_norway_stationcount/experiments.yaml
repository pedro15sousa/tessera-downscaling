#
# Norway PLACEMENT experiment — STATION-COUNT (step) variant.
#
# Companion to snapshot_14y_eu_placement_norway (the temporal rollout). Same
# architectures / probe set / descriptor orderings; the difference is the
# schedule regime (built by build_station_count_schedule.py, not
# build_rollout_schedule.py):
#
#   * NO temporal axis. At budget k the first k stations of the ordering are
#     active from train_start (their FULL record — deployed "now", equal footing
#     with the always-on European stations); train_end is the dataset's real
#     train_end at EVERY budget (no T_0 back-off, no maturation).
#   * The only variable is which k stations are in — the pure placement /
#     optimal-experimental-design question, isolated from the how-long-a-station-
#     has-been-live confound of the rollout.
#
# Budgets are small fractions of the 1505-station pool (k ≤ 250 = ≤17 %), the
# regime where the deployed sets are near-disjoint across strategies — the
# regime the temporal grid can't resolve (large-k subsets are forced to overlap,
# so random ≈ smart by pigeonhole). The temporal rollout stays the realistic /
# deployable companion; this is the controlled experiment + steady-state answer.
#
# k000 is the pure-transfer cold start (no Norwegian probes, Europe-only, full
# history). It is strategy-independent, so all strategies must agree at k000 —
# a built-in sanity check on the harness.
#
# submit.sh drives one schedule per strategy into a per-strategy results subtree.
# Unlike the temporal folder, `random` is NOT reused from elsewhere (the training
# regime differs — full history vs staggered), so it is trained here too.

sweep_points:
  - label: k000
    description: "0 probes — pure transfer from Europe (strategy-independent anchor)"
  - label: k010
    description: "10 Norwegian stations deployed (0.7% of pool)"
  - label: k025
    description: "25 Norwegian stations (1.7%)"
  - label: k050
    description: "50 Norwegian stations (3.3%)"
  - label: k075
    description: "75 Norwegian stations (5.0%)"
  - label: k100
    description: "100 Norwegian stations (6.6%)"
  - label: k150
    description: "150 Norwegian stations (10.0%)"
  - label: k250
    description: "250 Norwegian stations (16.6%)"

architectures:

  # ------- t2m (Gaussian) -------
  - name: t2m_snap_vae_lat16_concat_with_elev_mtpi_no_static_wd
    label: "t2m snap VAE-lat16 concat DIRECT (with elev + mTPI, no static, wd=1e-4)"
    family: tessera
    target_variables: [t2m]
    extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --use-mtpi --weight-decay 1e-4"

  - name: t2m_snap_bilinear_baseline_mtpi_wd
    label: "t2m snap ConvCNP no-TESSERA (with elev + mTPI + static, wd=1e-4)"
    family: baseline
    target_variables: [t2m]
    extra_args: "--interpolation bilinear --use-mtpi --weight-decay 1e-4"

  # ------- wind (truncated-normal) -------
  - name: wind_truncnormal_snap_vae_lat16_concat_with_elev_mtpi_no_static_wd
    label: "wind snap VAE-lat16 concat DIRECT (with elev + mTPI, no static, wd=1e-4) — truncated-normal head"
    family: tessera
    target_variables: [wind]
    extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

  - name: wind_truncnormal_snap_bilinear_baseline_mtpi_wd
    label: "wind snap ConvCNP no-TESSERA (with elev + mTPI + static, wd=1e-4) — truncated-normal head"
    family: baseline
    target_variables: [wind]
    extra_args: "--interpolation bilinear --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

# No simple_baselines here: the ERA5-interp reference (deterministic, a constant
# line on held-out Norway) is already in the temporal-rollout tree
# (training_runs_snapshot_14y_eu_temporal_rollout_norway_lat16_mtpi); analysis
# reuses it rather than recomputing.
