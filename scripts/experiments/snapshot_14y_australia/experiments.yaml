# heavy tails, multimodality) the parametric families miss. The head has no
# tractable density, so --loss-function crps is mandatory (train.py refuses
# nll). Two arch flavors per variable: convcnp baseline (no TESSERA) and
# lat16 VAE-latent direct concat (no projection).
