# ==========================================================================
# snapshot_14y_eu_temporal_rollout_norway_lat16_mtpi -- Norway station-network
# rollout (Fig 7 of the preprint / Fig 9 of the AMS draft), baseline arms
# ==========================================================================
# Design. A set of 1,505 Norwegian probe stations (probe_station_ids.json,
# built by pick_probe_set.py) is "deployed" linearly over T_rollout = 36 months
# starting at T_0 = 2014-12-31: each probe gets an activation timestamp
# (rollout_schedule.json, built by build_rollout_schedule.py) before which its
# observations are hidden from training. Each sweep point r<X> trains a fresh
# model on all European data up to train_end_override(X) (train_end_overrides.json)
# with the probes active from their activation dates
# (probe_active_from_r<X>.json), then evaluates on Europe with region_specs
# "all" so the probe / always-on / spatial-test breakdown comes out of a single
# eval pass. Runs land in
# <data root>/training_runs_snapshot_14y_eu_temporal_rollout_norway_lat16_mtpi/
# <arch>_<sweep>_seed<S>; the no-model references in <name>_seed42.
#
# Architectures mirror the canonical main-table spec of snapshot_14y_eu:
#   * TESSERA latents concatenated DIRECTLY at their native 16-d.
#   * --use-mtpi adds per-station mTPI as a 3rd MLP feature (elevation,
#     delta_elevation, mTPI) for BOTH arms; the baseline keeps its 13 ERA5
#     static channels.
#   * wind uses the truncated-normal head; t2m stays Gaussian.
# ${VAE_LATENTS_PATH} is the v1 lat16 file here (this folder = baseline arm +
# v1 TESSERA arm + interp references); the paper's TESSERA arm with the 1B-M
# 2017 latents is the sibling folder
# snapshot_14y_eu_temporal_rollout_norway_tessera_1B-M_2017 (same schedule
# files, same architectures, only the latents file differs).
#
# The r6y point (full train window, all probes online) reconciles with the
# fixed-region snapshot_14y_eu results of the same architectures.
#
# Sweep grid: 10 points; the post-completion regime (r3y..r6y) is sampled
# yearly.
#
# Grammar (parsed by notebooks/_helpers.py): sweep_points (label/description),
# architectures (name/label/family/target_variables/extra_args), and
# simple_baselines (name/baseline/target_variables[/extra_args]).
# ==========================================================================

sweep_points:
  - label: r0
    description: "0 months elapsed (rollout anchor T_0): no probes online — pre-deployment European-only baseline"
  - label: r1mo
    description: "1 month elapsed since rollout started — ~3% online"
  - label: r3mo
    description: "3 months elapsed — ~8% online"
  - label: r6mo
    description: "6 months elapsed — ~17% online"
  - label: r1y
    description: "1 year elapsed — ~33% online"
  - label: r2y
    description: "2 years elapsed — ~67% online"
  - label: r3y
    description: "3 years elapsed (= T_rollout): rollout complete, all online"
  - label: r4y
    description: "4 years elapsed (= T_rollout + 1y): all online for at least 1y"
  - label: r5y
    description: "5 years elapsed (= T_rollout + 2y): all online for at least 2y"
  - label: r6y
    description: "6 years elapsed (= T_rollout + 3y): all online for at least 3y"

architectures:

  # ------- t2m -------
  - name: t2m_snap_vae_lat16_concat_with_elev_mtpi_no_static_wd
    label: "t2m snap VAE-lat16 concat DIRECT (with elev + mTPI, no static, wd=1e-4)"
    family: tessera
    target_variables: [t2m]
    extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4"

  - name: t2m_snap_bilinear_baseline_mtpi_wd
    label: "t2m snap ConvCNP no-TESSERA (with elev + mTPI + static, wd=1e-4)"
    family: baseline
    target_variables: [t2m]
    extra_args: "--interpolation bilinear --use-mtpi --weight-decay 1e-4"

  # ------- wind -------
  - name: wind_truncnormal_snap_vae_lat16_concat_with_elev_mtpi_no_static_wd
    label: "wind snap VAE-lat16 concat DIRECT (with elev + mTPI, no static, wd=1e-4) — truncated-normal head"
    family: tessera
    target_variables: [wind]
    extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

  - name: wind_truncnormal_snap_bilinear_baseline_mtpi_wd
    label: "wind snap ConvCNP no-TESSERA (with elev + mTPI + static, wd=1e-4) — truncated-normal head"
    family: baseline
    target_variables: [wind]
    extra_args: "--interpolation bilinear --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

# Simple non-trained baselines. No x-sweep, no model seed. ERA5
# bilinear interp = constant horizontal reference line on plots.
# train_end_override is irrelevant here because these baselines
# don't train — they just compute MAE between ERA5-interpolated-to-
# station-location and the held-out station observations.
#
# t2m carries a SECOND interp row: era5_interp_lapse, which transfers the
# ERA5 2 m temperature from the model orography to the true station height
# at a constant lapse rate (T_station = T_interp - G * delta_elev). ERA5's
# orography is smooth, so in Norway the uncorrected field is systematically
# wrong at elevation; the correction uses only delta_elev, a feature the
# ConvCNPs already receive, so it takes no information the models lack.
# This is the row the rollout figures draw as their t2m reference line.
# Wind has no lapse analogue (the script refuses non-t2m targets), so it
# keeps plain era5_interp.
#
# G defaults to the textbook 6.5 K/km. A Gamma fitted on the train split
# (3.90 K/km here) lands within 0.006 C of it (1.3442 vs 1.3500 MAE), so
# the row is not sensitive to the choice; it is kept as the
# ..._lapse_fitted_baseline row for that sensitivity check.
simple_baselines:
  - name: t2m_snap_era5_interp_baseline
    baseline: era5_interp
    target_variables: [t2m]
  - name: t2m_snap_era5_interp_lapse_baseline
    baseline: era5_interp_lapse
    target_variables: [t2m]
  - name: t2m_snap_era5_interp_lapse_fitted_baseline
    baseline: era5_interp_lapse
    target_variables: [t2m]
    extra_args: "--lapse-rate-mode fitted --lapse-fit-stride 4"
  - name: wind_snap_era5_interp_baseline
    baseline: era5_interp
    target_variables: [wind]
