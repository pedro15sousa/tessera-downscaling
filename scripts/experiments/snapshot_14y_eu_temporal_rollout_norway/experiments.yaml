#
# DIFFERENCE vs the temporal-efficiency variant:
#   * Per-probe-station active-from timestamps are STAGGERED across
#     stations (rollout schedule) rather than uniform (single timestamp
#     for the entire probe set).
#   * Each sweep point also pins a train_end_override value — the
#     dataset's train/val boundary moves to T_0 + x for that sweep.
#     Training observations are bounded BOTH below (per-station
#     active_from) AND above (uniform train_end_override). Combined,
#     this simulates a strict snapshot: at time T_0 + x, the model
#     sees ONLY the data that would have been available by then.
#   * ERA5 normalisation stats are computed from the full
#     metadata.train_end window (NOT the override) so the ERA5 z-scores
#     are identical across sweep points and the curves are comparable.
#
# THE ROLLOUT SCHEDULE itself (per-station t_open[i] values + per-sweep
# train_end_override values) lives in rollout_schedule.json, NOT here.
# That file is hand-generated by a notebook cell once and then read
# verbatim by submit.sh; this YAML only lists the sweep_label values
# and the architectures/seeds/baselines.
#
# Submit-script cross-product:
#   architectures × sweep_points × seeds → sbatch jobs (each gets
#   --probe-active-from-file + --train-end-override flags)
# Plus simple_baselines (run once per variable; no x-sweep, no seed,
# and the train_end_override does not apply to them since they don't
# train).

# Sweep labels. Anchor convention: "r{X}" = X elapsed since rollout
# started. The first stations come online at T_0 (rollout start),
# and the last come online at T_0 + T_rollout. T_rollout is fixed
# (set in the notebook cell that generates rollout_schedule.json,
# canonically 3 years).
#
# At r1mo: rollout just starting, ~3% of probes online with at most
#          1 month of data each.
# At r3y:  rollout just completed (T_rollout = 3y), all probes online,
#          history range = [0, 3y].
# At r6y:  rollout completed 3 years ago, history range = [3y, 6y].
sweep_points:
  - label: r1mo
    description: "1 month elapsed since rollout started — ~3% online"
  - label: r3mo
    description: "3 months elapsed — ~8% online"
  - label: r6mo
    description: "6 months elapsed — ~17% online"
  - label: r1y
    description: "1 year elapsed — ~33% online"
  - label: r2y
    description: "2 years elapsed — ~67% online"
  - label: r3y
    description: "3 years elapsed (= T_rollout): rollout complete, all online"
  - label: r6y
    description: "6 years elapsed (= T_rollout + 3y): all online for at least 3y"

architectures:

  # ------- t2m -------
  - name: t2m_snap_vae_lat16_proj8_concat_with_elev_no_static_wd
    label: "t2m snap VAE-lat16→proj8 concat (with elev, no static, wd=1e-4) — rank-1 TESSERA"
    family: tessera
    target_variables: [t2m]
    extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --vae-latents-proj-dim 8 --no-static-fields --weight-decay 1e-4"

  - name: t2m_snap_bilinear_baseline_wd
    label: "t2m snap ConvCNP no-TESSERA (with elev + static, wd=1e-4)"
    family: baseline
    target_variables: [t2m]
    extra_args: "--interpolation bilinear --weight-decay 1e-4"

  # ------- wind -------
  - name: wind_snap_vae_lat16_proj8_concat_with_elev_no_static_wd
    label: "wind snap VAE-lat16→proj8 concat (with elev, no static, wd=1e-4) — matched-arch"
    family: tessera
    target_variables: [wind]
    extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --vae-latents-proj-dim 8 --no-static-fields --weight-decay 1e-4"

  - name: wind_snap_bilinear_baseline_wd
    label: "wind snap ConvCNP no-TESSERA (with elev + static, wd=1e-4)"
    family: baseline
    target_variables: [wind]
    extra_args: "--interpolation bilinear --weight-decay 1e-4"

# Simple non-trained baselines. No x-sweep, no model seed. ERA5
# bilinear interp = constant horizontal reference line on plots.
# train_end_override is irrelevant here because these baselines
# don't train — they just compute MAE between ERA5-interpolated-to-
# station-location and the held-out station observations.
simple_baselines:
  - name: t2m_snap_era5_interp_baseline
    baseline: era5_interp
    target_variables: [t2m]
  - name: wind_snap_era5_interp_baseline
    baseline: era5_interp
    target_variables: [wind]