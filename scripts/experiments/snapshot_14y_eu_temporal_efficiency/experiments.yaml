# snapshot_14y_eu_temporal_efficiency experiments
#
# Per-station deployment-time data-efficiency experiment for EU 14y.
#
# Design (decided with Will + Rich on May 21–22 thread):
#
#   * Carve a fixed 5% probe set from the EU 85% train-split stations.
#     The remaining ~80% always-on train stations have full observations
#     across the 11-year training window. The 15% spatial test stations
#     are untouched and held out as in every other 14y EU experiment.
#   * Sweep the per-probe-station active-from timestamp across six
#     points (x = {0, 3mo, 1y, 3y, 6y, full ~11y}). At each x, the probe
#     set is trained on only the LAST x months of observations; everything
#     else is held constant.
#   * Three subset metrics are reported per (variable, run):
#       (a) 80% always-on   (sanity check — should be roughly flat in x)
#       (b)  5% probe       (the curve we actually care about)
#       (c) 15% spatial test (held-out-station story — comparable to
#           existing 14y EU baseline numbers at x=full)
#   * Architectures: rank-1 vanilla TESSERA winner per variable +
#     bilinear no-TESSERA baseline per variable + ERA5 bilinear interp
#     (deterministic, runs once per variable as a constant horizontal
#     reference). t2m and wind only, both Gaussian heads.
#
# Submit-script cross-product:
#
#   architectures × sweep_points × seeds → sbatch jobs
#
# At submit time, submit.sh:
#   1. Picks the probe set ONCE from EU train-split stations, with
#      selection_seed=0, sampling exactly 5% (rounded down).
#   2. Writes a single ``probe_station_ids.json`` next to this YAML for
#      audit / reproducibility.
#   3. For each sweep_point, writes a ``probe_active_from_{label}.json``
#      mapping every probe station's id → that point's ``active_from``.
#   4. Issues one sbatch per (architecture, sweep_point, seed).
#   5. ERA5 bilinear interp + persistence baselines run ONCE per
#      variable (no x-sweep, no model-seed effect).

probe_set:
  # The fraction is interpreted by submit.sh; ``selection_seed`` is the
  # numpy random seed used for the sampling step. Both are deliberately
  # in the YAML rather than the bash so the values are review-visible.
  fraction: 0.05
  selection_seed: 0
  source_region: europe
  source_spatial_split: train

train_end: "2020-12-31-23"

# Order = display order in the resulting plot's x-axis. ``label`` is
# used in the run directory name; ``active_from`` is the timestamp
# value written into every probe station's entry of the per-sweep-point
# active-from JSON file.
#
# Edge values use sentinel strings that compare lexicographically
# outside the dataset's actual timestamp range:
#   * "t0":   "9999-12-31-23" → strictly later than every train
#     episode, so the probe set is excluded from training entirely.
#   * "tfull":"0000-01-01-00" → strictly earlier than the dataset's
#     2010-01-01 start, so every probe-station training episode passes
#     the filter — equivalent to a probe being a regular train station.
sweep_points:
  - label: t0
    active_from: "9999-12-31-23"
    description: "x=0: probe stations completely held out (analogue of the spatial test set)"
  - label: t3mo
    active_from: "2020-10-01-00"
    description: "Last 3 months of training"
  - label: t1y
    active_from: "2020-01-01-00"
    description: "Last 1 year of training"
  - label: t3y
    active_from: "2018-01-01-00"
    description: "Last 3 years of training"
  - label: t6y
    active_from: "2015-01-01-00"
    description: "Last 6 years of training"
  - label: tfull
    active_from: "0000-01-01-00"
    description: "Full training window (~11y) — probe behaves like an always-on train station"

# Architectures — same names + extra_args as the existing
# snapshot_14y_eu/experiments.yaml entries for the rank-1 winners and
# baselines, so the headline numbers line up apples-to-apples.
# region_specs_train applied uniformly: EU-train. region_specs_test is
# OVERRIDDEN by submit.sh to {europe: all} so the per-subset breakdown
# can be computed on the full 100% station set during the test year.
architectures:

  # ------- t2m -------
  - name: t2m_snap_vae_lat16_proj8_concat_with_elev_no_static_wd
    label: "t2m snap VAE-lat16→proj8 concat (with elev, no static, wd=1e-4) — rank-1 TESSERA"
    family: tessera
    target_variables: [t2m]
    extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --vae-latents-proj-dim 8 --no-static-fields --weight-decay 1e-4"

  - name: t2m_snap_bilinear_baseline_wd
    label: "t2m snap ConvCNP no-TESSERA (with elev + static, wd=1e-4)"
    family: baseline
    target_variables: [t2m]
    extra_args: "--interpolation bilinear --weight-decay 1e-4"

  # ------- wind -------
  - name: wind_snap_vae_lat16_proj8_concat_with_elev_no_static_wd
    label: "wind snap VAE-lat16→proj8 concat (with elev, no static, wd=1e-4) — matched-arch (tied with rank-1 within seed noise)"
    family: tessera
    target_variables: [wind]
    extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --vae-latents-proj-dim 8 --no-static-fields --weight-decay 1e-4"

  - name: wind_snap_bilinear_baseline_wd
    label: "wind snap ConvCNP no-TESSERA (with elev + static, wd=1e-4)"
    family: baseline
    target_variables: [wind]
    extra_args: "--interpolation bilinear --weight-decay 1e-4"

# Simple non-trained baselines that run once per variable, no x-sweep,
# no model seed. ERA5 bilinear interpolation = constant horizontal
# reference line on the resulting plots.
simple_baselines:
  - name: t2m_snap_era5_interp_baseline
    baseline: era5_interp
    target_variables: [t2m]
  - name: wind_snap_era5_interp_baseline
    baseline: era5_interp
    target_variables: [wind]