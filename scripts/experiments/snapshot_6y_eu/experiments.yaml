  colour: "#ff7f0e"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection film --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --weight-decay 1e-4 --loss-function crps"

