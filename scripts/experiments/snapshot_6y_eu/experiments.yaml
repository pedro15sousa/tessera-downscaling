# =========================================================================
# snapshot_6y_eu — extension: TN/CRPS axis additions
# =========================================================================
# Adds:
#   * t2m (gaussian) — CRPS-loss: bilinear baseline + 3 TESSERA archs
#   * wind (truncated_normal) — NLL-loss: bilinear baseline + 3 TESSERA archs
#   * wind (truncated_normal) — CRPS-loss: bilinear baseline + 3 TESSERA archs
# Universal pair (lat16-concat, lat16→proj8-concat) included regardless of top-N rank.

# --- t2m gaussian + CRPS loss ---

- name: t2m_snap_bilinear_baseline_wd_crps
  label: "t2m snap bilinear baseline (with elev, with static, wd=1e-4, CRPS-loss)"
  colour: "#999999"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --weight-decay 1e-4 --loss-function crps"

- name: t2m_snap_vae_lat16_concat_with_elev_no_static_wd_crps
  label: "t2m snap VAE-lat16 concat (with elev, no static, wd=1e-4) — CRPS-loss"
  colour: "#1f77b4"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --weight-decay 1e-4 --loss-function crps"

- name: t2m_snap_vae_lat16_proj8_concat_with_elev_no_static_wd_crps
  label: "t2m snap VAE-lat16→proj8 concat (with elev, no static, wd=1e-4) — CRPS-loss"
  colour: "#1f77b4"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --vae-latents-proj-dim 8 --no-static-fields --weight-decay 1e-4 --loss-function crps"

- name: t2m_snap_vae_lat16_film_with_elev_no_static_wd_crps
