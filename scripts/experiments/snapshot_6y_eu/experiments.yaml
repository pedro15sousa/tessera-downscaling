# =========================================================================
# Generative head — NON-NEGATIVE variant (softplus output) for wind / precip
#
# Same implicit CRPS-trained generator as `generative`, but samples are passed
# through softplus so the predictive support is (0, inf) — matching the support
# of wind / precip and removing the sharpness handicap vs TruncNormal / B-G
# (which build the >=0 constraint in). t2m is real-valued and keeps the plain
# `generative` head. Two arch flavors per variable: convcnp baseline and
# lat16 VAE-latent direct concat.
# =========================================================================

