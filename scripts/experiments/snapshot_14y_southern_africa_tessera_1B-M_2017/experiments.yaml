- name: wind_truncnormal_snap_vae_crop64_lat32_auxoff_concat_mtpi
  label: "Wind (TruncNormal) VAE crop64-lat32 auxoff concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#d62728"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat32_grad0.5_auxoff.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

# =========================================================================
# EXTRA DESCRIPTORS on the shortlisted variant (crop64_lat16_auxon), added
# 2026-07-26. Hand-crafted surface/topography descriptors after Bakketun
# et al. 2026 (arXiv:2607.02824), 17 dims, concatenated with the VAE
# latents by train.py (both flags passed; derived cache + z-score stats
# pre-built by concat_station_vectors.py so concurrent jobs only read).
# Pairs with the identically-named crop64_lat16_auxon entry above (same
# latents, same station set) and with the baseline / baseline+extradesc
# arms in the sibling snapshot_14y_<region> folder, forming the 2x2:
#   {baseline, TESSERA} x {without, with extra descriptors}.
# =========================================================================

- name: t2m_snap_vae_crop64_lat16_auxon_extradesc_concat_mtpi
  label: "t2m VAE crop64-lat16 auxon + extra descriptors concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#e377c2"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat16_grad0.5_auxon.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --extra-descriptors-path ${EXTRA_DESCRIPTORS_PATH} --extra-descriptors-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_vae_crop64_lat16_auxon_extradesc_concat_mtpi
  label: "Wind (TruncNormal) VAE crop64-lat16 auxon + extra descriptors concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#e377c2"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat16_grad0.5_auxon.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --extra-descriptors-path ${EXTRA_DESCRIPTORS_PATH} --extra-descriptors-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

# =========================================================================
# PATCH SUMMARY-STATISTICS control on the shortlisted variant
# (crop64_lat16_auxon) — paper Appendix A. Replaces the learnt VAE patch
# encoder with 16 hand-crafted statistics over the SAME central 64x64
# (~640 m) window of the same ${TESSERA_VARIANT} ${EMBED_YEAR} patches:
# top-4 channels by cross-train-station variance x {mean, std, p10, p90}
# (build_summary_stats_latents.py --center-crop 64; NaN-mask aligned to the
# crop64_lat16_auxon latents so the station set matches the live and
# shuffled arms). Identical architecture and parameter count to the lat16
# arms — only the content of the 16-d per-station vector changes.
# =========================================================================

- name: t2m_snap_stats16_crop64_concat_mtpi
  label: "t2m patch summary-stats 16-d crop64 concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#9467bd"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${SUMMARY_STATS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_stats16_crop64_concat_mtpi
  label: "Wind (TruncNormal) patch summary-stats 16-d crop64 concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#9467bd"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${SUMMARY_STATS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"
