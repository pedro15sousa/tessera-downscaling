# ==========================================================================
# snapshot_14y_southern_africa_tessera_1B-M_2017 -- the paper's TESSERA arm, region "southern_africa"
# ==========================================================================
# Runs land in <data root>/training_runs_snapshot_14y_southern_africa_tessera_1B-M_2017/
# <name>_seed<S> (seeds 42/123/456). Same dataset, region, normalisation and
# hyperparameters as the baseline folder snapshot_14y_southern_africa (see submit.sh).
#
# CANONICAL PAPER ARM (Table 1, Fig 2, and every downstream TESSERA number):
#     t2m_snap_vae_crop64_lat16_auxon_concat_mtpi
#     wind_truncnormal_snap_vae_crop64_lat16_auxon_concat_mtpi
# i.e. TESSERA 1B-M (v2) 2017 embeddings -> p128 station patches -> VAE trained
# on the central 64x64 window with 16-d latent, gradient loss 0.5 and the
# auxiliary elevation/lat/lon heads ON -> latents concatenated directly to the
# per-station vector (elev, delta-elev, mTPI), ERA5 static fields OFF,
# wd = 1e-4, bilinear interpolation.
#
# The other entries are model-selection provenance and controls:
#   * VAE-variant sweep, paper config only, varying crop64 x lat {16,32} x
#     aux {on,off} -- the shortlist after the EU / East-Asia round eliminated
#     crop128 and lat64 (see notebooks/tessera_1bm_variant_shortlist.ipynb).
#   * ..._crop64_lat16_auxon_extradesc_concat_mtpi: canonical arm + the 17
#     hand-crafted descriptors (the 2x2 with the baseline folder's
#     bilinear_baseline_mtpi[_extradesc]_wd rows; AMS Table 6 / App. C).
#   * ..._stats16_crop64_concat_mtpi: 16 hand-crafted patch summary
#     statistics in place of the VAE latent (paper Appendix A control).
#
# The tessera variant (1B-M) and embedding year (2017) are FOLDER-level axes:
# submit.sh exports TESSERA_VARIANT and EMBED_YEAR, expanded inside this yaml,
# so entry names carry only crop/lat/aux. Latents live in
# processed/vae_tessera_${TESSERA_VARIANT}/ (see provenance.txt there) and are
# row-aligned with processed/tessera_global/station_list_filtered.csv.
# ==========================================================================

# ---- crop64, lat16 ----
- name: t2m_snap_vae_crop64_lat16_auxon_concat_mtpi
  label: "t2m VAE crop64-lat16 auxon concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#1f77b4"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat16_grad0.5_auxon.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_vae_crop64_lat16_auxon_concat_mtpi
  label: "Wind (TruncNormal) VAE crop64-lat16 auxon concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#1f77b4"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat16_grad0.5_auxon.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

- name: t2m_snap_vae_crop64_lat16_auxoff_concat_mtpi
  label: "t2m VAE crop64-lat16 auxoff concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#ff7f0e"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat16_grad0.5_auxoff.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_vae_crop64_lat16_auxoff_concat_mtpi
  label: "Wind (TruncNormal) VAE crop64-lat16 auxoff concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#ff7f0e"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat16_grad0.5_auxoff.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

# ---- crop64, lat32 ----
- name: t2m_snap_vae_crop64_lat32_auxon_concat_mtpi
  label: "t2m VAE crop64-lat32 auxon concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#2ca02c"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat32_grad0.5_auxon.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_vae_crop64_lat32_auxon_concat_mtpi
  label: "Wind (TruncNormal) VAE crop64-lat32 auxon concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#2ca02c"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat32_grad0.5_auxon.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

- name: t2m_snap_vae_crop64_lat32_auxoff_concat_mtpi
  label: "t2m VAE crop64-lat32 auxoff concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#d62728"
