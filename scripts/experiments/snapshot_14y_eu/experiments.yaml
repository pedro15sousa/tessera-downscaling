# =========================================================================
# snapshot_14y_eu -- baseline arms for region "europe"
# =========================================================================
# Runs land in <data root>/training_runs_snapshot_14y_eu/<name>_seed<S>
# (seeds 42/123/456), trained on dataset_timestamp_global with
# --train-regions europe (per-region normalisation stats; see submit.sh).
#
# This folder holds every arm of the paper that does NOT depend on the TESSERA
# latents (they are latents-independent, so they are shared by every TESSERA
# generation):
#   * the no-model references: persistence and ERA5 bilinear interpolation
#     (t2m additionally with a lapse-rate correction, fixed 6.5 K/km -- the row
#     the paper reports -- and, as a sensitivity check, fitted on the train
#     split);
#   * the no-TESSERA ConvCNP baseline (+ elevation, delta-elevation, mTPI;
#     ERA5 static fields on; wd = 1e-4) -- Table 1 / Fig 2 baseline;
#   * the same baseline + the 17 hand-crafted surface descriptors
#     (Bakketun et al. 2026 style) -- the AMS draft's hand-crafted row;
#   * the v1 (2024 p64, lat16) TESSERA arm with the same +mTPI architecture.
#     Superseded as the paper's TESSERA arm but still referenced: its
#     eval_train_stations/ give the Fig 2 train-station counts, and it is the
#     architecture the Norway rollout (snapshot_14y_eu_temporal_rollout_*)
#     reuses.
#
# The paper's TESSERA arm (1B-M, 2017 embeddings, crop64_lat16_auxon VAE
# latents) lives in the sibling folder snapshot_14y_eu_tessera_1B-M_2017;
# its shuffled-latent control in ..._tessera_1B-M_2017_shuffled.
#
# Entry names are identical across the five regional folders. Fields:
#   name / label / colour / target_variables / extra_args [/ baseline_kind]
# (baseline_kind marks the no-model references, run through tessera-baselines
# instead of tessera-train). ${...} references are expanded from the env
# exported by submit.sh.
# =========================================================================

# ---- no-model references: t2m ----

- name: t2m_snap_era5_interp_baseline
  label: "t2m snap ERA5 interpolation (no model, K→°C)"
  colour: "#cccccc"
  target_variables: [t2m]
  extra_args: ""
  baseline_kind: era5_interp

# Lapse-rate-corrected ERA5 interpolation. t2m only -- wind speed has no
# lapse-rate analogue, and tessera-baselines refuses non-t2m targets rather
# than emitting a row numerically identical to plain era5_interp.
#   fixed  : the textbook 6.5 K/km environmental lapse rate (paper row).
#   fitted : Gamma estimated by least squares on the TRAIN split (train
#            stations, train years). Resolved Gamma and its fit diagnostics
#            land in test_summary.json under "lapse_rate".
# Reporting both shows the row is not sensitive to the choice of Gamma.
- name: t2m_snap_era5_interp_lapse_baseline
  label: "t2m snap ERA5 interp + lapse rate (fixed 6.5 K/km)"
  colour: "#c7b299"
  target_variables: [t2m]
  extra_args: "--lapse-rate-mode fixed"
  baseline_kind: era5_interp_lapse

- name: t2m_snap_era5_interp_lapse_fitted_baseline
  label: "t2m snap ERA5 interp + lapse rate (fitted on train)"
  colour: "#a68b6d"
  target_variables: [t2m]
  extra_args: "--lapse-rate-mode fitted --lapse-fit-stride 4"
  baseline_kind: era5_interp_lapse

- name: t2m_snap_persistence_baseline
  label: "t2m snap persistence (most recent valid obs ≤24h)"
  colour: "#dddddd"
  target_variables: [t2m]
  extra_args: ""
  baseline_kind: persistence

# ---- no-model references: wind ----

- name: wind_snap_era5_interp_baseline
  label: "Wind snap ERA5 interpolation (no model, sqrt(u²+v²))"
  colour: "#cccccc"
  target_variables: [wind]
  extra_args: ""
  baseline_kind: era5_interp

- name: wind_snap_persistence_baseline
  label: "Wind snap persistence (most recent valid obs ≤24h)"
  colour: "#dddddd"
  target_variables: [wind]
  extra_args: ""
  baseline_kind: persistence

# ---- no-TESSERA ConvCNP baseline (+ elev, delta-elev, mTPI; static on) ----

- name: t2m_snap_bilinear_baseline_mtpi_wd
  label: "t2m snap bilinear baseline (with elev + mTPI, with static, wd=1e-4)"
  colour: "#555555"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_bilinear_baseline_mtpi_wd
  label: "Wind (TruncNormal) snap bilinear baseline (with elev + mTPI, with static, wd=1e-4)"
  colour: "#555555"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

# ---- baseline + hand-crafted extra descriptors (17-d, Bakketun et al. 2026) ----
# Descriptors are served through the same precomputed-vector pathway as the
# VAE latents (--tessera-injection concat); static fields stay on to mirror
# the parent baseline.

- name: t2m_snap_bilinear_baseline_mtpi_extradesc_wd
  label: "t2m snap bilinear baseline + extra descriptors (with elev + mTPI, with static, wd=1e-4)"
  colour: "#8c564b"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --extra-descriptors-path ${EXTRA_DESCRIPTORS_PATH} --extra-descriptors-station-csv ${VAE_LATENTS_CSV} --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_bilinear_baseline_mtpi_extradesc_wd
  label: "Wind (TruncNormal) snap bilinear baseline + extra descriptors (with elev + mTPI, with static, wd=1e-4)"
  colour: "#8c564b"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --extra-descriptors-path ${EXTRA_DESCRIPTORS_PATH} --extra-descriptors-station-csv ${VAE_LATENTS_CSV} --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

# ---- v1 TESSERA arm (2024 p64 patches, v1 VAE lat16 latents; +mTPI) ----
# ${VAE_LATENTS_PATH} = processed/station_latents_lat16_grad0.5.npy.

- name: t2m_snap_vae_lat16_concat_with_elev_mtpi_no_static_wd
  label: "t2m snap VAE-lat16 concat (with elev + mTPI, no static, wd=1e-4)"
  colour: "#9467bd"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_vae_lat16_concat_with_elev_mtpi_no_static_wd
  label: "Wind (TruncNormal) snap VAE-lat16 concat (with elev + mTPI, no static, wd=1e-4)"
  colour: "#9467bd"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"
