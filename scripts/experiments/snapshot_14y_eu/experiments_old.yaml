# -------------------------------------------------------------------------
# Shuffled-latent controls  (vae_lat16, lat16 row-permuted with seed 0)
# -------------------------------------------------------------------------
# Verifies that gains in the matrix above are attributable to genuine
# station-specific signal in TESSERA latents, not to model capacity. Each
# cell loads a row-shuffled copy of the lat16 latents file (produced once
# by scripts/shuffle_latents.py with seed 0). Shuffling permutes only the
# non-NaN rows among themselves so the dataset's NaN-based station filter
# yields the identical station set on the shuffled run as on the unshuffled
# run, and the model's parameter count is unchanged. Only the
# (station_id, latent_vector) mapping is broken.
#
# Reading
#   shuffled performance ≈ real performance        → mechanism uses model
#                                                    capacity, not station
#                                                    signal
#   shuffled performance ≈ no-TESSERA baseline     → mechanism uses station
#                                                    signal heavily
#   intermediate                                    → partial signal usage
#
# Scope: one latent setting (vae_lat16). The (baseline, noinj) cell is
# omitted: no TESSERA path is active, so the shuffled latent is never
# read; the run is identical to wind_snap_setconv_baseline_no_static_wd.
#
# Requires:
#   1. ${VAE_LATENTS_PATH_SHUFFLED} env var added to submit.sh, pointing
#      at the shuffled .npy.
#   2. scripts/shuffle_latents.py run once before first submit:
#        python projects/tessera_downscaling/scripts/shuffle_latents.py \
#          --input  .tmp_output/processed/station_latents_lat16_grad0.5.npy \
#          --output .tmp_output/processed/station_latents_lat16_grad0.5_shuffle_seed0.npy \
#          --seed   0
# =========================================================================


