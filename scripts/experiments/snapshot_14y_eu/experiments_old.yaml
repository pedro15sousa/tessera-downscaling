# -------------------------------------------------------------------------
# Set H — Hand-crafted summary-stats baseline for the VAE latents
# -------------------------------------------------------------------------
# Tests whether the VAE-learned 16-d / 64-d compression earns its keep over
# a fixed-recipe summary of the same TESSERA patches: mean, std, p10, p90
# over the top-K most cross-train-station-variant channels (K=4 for dim16,
# K=16 for dim64). Same model, same injection path, same projection options;
# only the --vae-latents-path differs. Built once via
# scripts/preprocessing/build_summary_stats_latents.py.
# Single-task only — multi-task can wait for results to be interesting first.
