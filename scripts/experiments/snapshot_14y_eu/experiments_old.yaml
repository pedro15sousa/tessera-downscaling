# =========================================================================
# Simple non-ML baselines (no GPU required) — see 
# scripts/baselines/evaluate_simple_baselines.py for implementation.
# =========================================================================
# - era5_interp: bilinearly interpolate raw ERA5 to station coords
#                (with K→°C conversion for t2m, sqrt(u²+v²) for wind).
# - persistence: predict the most recent valid GHCNh observation at
#                the same station within a 24h lookback window.
#
# These carry a `baseline_kind` field that submit.sh detects and
# routes to the baselines evaluator. They are deterministic, so all
# 3 seeds produce identical numbers — kept seed×3 only because the
# analysis loader expects ≥3 seeds per experiment.

- name: t2m_snap_era5_interp_baseline
  label: "t2m snap ERA5 interpolation (no model, K→°C)"
  colour: "#cccccc"
  target_variables: [t2m]
  extra_args: ""
  baseline_kind: era5_interp

- name: wind_snap_era5_interp_baseline
  label: "Wind snap ERA5 interpolation (no model, sqrt(u²+v²))"
  colour: "#cccccc"
  target_variables: [wind]
  extra_args: ""
  baseline_kind: era5_interp

- name: t2m_snap_persistence_baseline
  label: "t2m snap persistence (most recent valid obs ≤24h)"
  colour: "#dddddd"
  target_variables: [t2m]
  extra_args: ""
  baseline_kind: persistence

- name: wind_snap_persistence_baseline
  label: "Wind snap persistence (most recent valid obs ≤24h)"
  colour: "#dddddd"
  target_variables: [wind]
  extra_args: ""
  baseline_kind: persistence


