# =========================================================================
# Bilinear interpolation extension
# =========================================================================
# Tests whether the attention mechanism still helps when the grid→target
# read is the parameter-free bilinear interpolation rather than the
# learned-σ RBF SetConv. Attention is interpolation-agnostic by
# construction: it operates on (target embeddings, target coordinates)
# only, and its output is concatenated to the per-target MLP input —
# the grid→target path runs in parallel.
#
# Bilinear's structural property is sharper-but-narrower reading of the
# weather grid (4 nearest cells with bilinear weights, no Gaussian tail).
# Forces all local station correction onto TESSERA rather than the
# weather pathway — combining with attention puts the full weight of the
# correction on the embedding mechanism.
#
# Scope: run at the two winning latent settings (lat16→proj8, lat64→proj16),
# both variables, both injection levels. 8 entries × 3 seeds = 24 runs.
# =========================================================================


