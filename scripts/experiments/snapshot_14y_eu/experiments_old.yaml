  label: "Wind snap SetConv baseline (with elev, with static, wd=1e-4)"
  colour: "#999999"
  target_variables: [wind]
  extra_args: "--interpolation setconv --weight-decay 1e-4"


- name: t2m_snap_setconv_baseline_wd
  label: "t2m snap SetConv baseline (with elev, with static, wd=1e-4)"
  colour: "#999999"
  target_variables: [t2m]
  extra_args: "--interpolation setconv --weight-decay 1e-4"


# =========================================================================
# Embedding-aware decoder mechanisms — mechanism × injection × latent
# =========================================================================
#
# Three axes, fully crossed.
#
# Axis 1 — decoder mechanism (5 levels):
#   baseline               No embedding-aware mechanism. The TESSERA
#                          latent enters only via the optional final-layer
#                          concat injection (axis 2).
#   kernelcond             Per-target lengthscale on the decoder SetConv.
#                          A small MLP maps each target's embedding to a
#                          delta-log-lengthscale; the kernel is otherwise
#                          identical to the standard RBFSetConv.
#                          (--decoder-kernel embedding_conditioned)
#   embedstream            A second SetConv aggregates the target-station
#                          embeddings onto the internal CNN grid; the
#                          result is concatenated channel-wise to the
#                          CNN's output before the decoder SetConv reads
#                          from it. (--use-target-embed-stream)
#   kernelcond_embedstream Both kernelcond and embedstream active
#                          together.
#   attnembed              Self-attention over the target set weighted by
#                          cosine similarity of embeddings only (no
#                          spatial term); the per-target attention output
#                          is concatenated to the MLP input alongside the
#                          SetConv output.
#                          (--target-embed-attention embedding)
#
# Axis 2 — final-layer injection of the per-target embedding (2 levels):
#   concat   Embedding is concatenated to the per-target MLP input.
#   noinj    Embedding does not enter the MLP input directly; whatever
#            the mechanism on axis 1 carries is the only TESSERA signal.
#
# Axis 3 — latent dim and linear projection (3 levels):
#   vae_lat16          16-d VAE latent, consumed directly (no projection).
#   vae_lat16_proj8    16-d VAE latent, linear projection to 8-d.
#   vae_lat64_proj16   64-d VAE latent, linear projection to 16-d.
#
# Full grid: 5 × 2 × 3 = 30 cells.
#
# Intentionally omitted
# ---------------------
# (baseline, noinj, vae_lat16_proj8) and (baseline, noinj, vae_lat64_proj16)
# are functionally equivalent to wind_snap_setconv_baseline_no_static_wd
# and its t2m sibling above: no TESSERA path consumes the latent, so the
# projection head's parameters never receive gradient and the predictions
# are equivalent to a no-TESSERA model on the same station set.
#
# Alternative-attention sibling
# -----------------------------
# The hybridattn cells use cosine similarity AND a Gaussian spatial term
# (--target-embed-attention hybrid). They sit outside the 30-cell matrix
# (which restricts the attention path to cosine-similarity-only) but are
# kept in the file as already-run reference points; included under the
# vae_lat16 / concat section below.
# =========================================================================


