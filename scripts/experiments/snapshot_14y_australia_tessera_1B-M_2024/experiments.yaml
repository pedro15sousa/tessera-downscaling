# ==========================================================================
# TESSERA 1B-M VAE-latent sweep — paper config only (direct concat, +mTPI,
# with elevation, no static fields, wd=1e-4), varying the VAE variant axes:
# SHORTLIST (post EU/EA round): crop64 only, lat {16,32} x aux {on,off} —
# crop128 and lat64 were eliminated (see tessera_1bm_variant_shortlist.ipynb).
#
# The tessera variant (1B-M) and embedding year (2017/2024) are FOLDER-level
# axes: submit.sh exports TESSERA_VARIANT and EMBED_YEAR, and this yaml is
# byte-identical across all snapshot_14y_<region>_tessera_<variant>_<year>
# experiment folders. Entry names therefore only carry crop/lat/aux.
#
# Latents live in processed/vae_tessera_${TESSERA_VARIANT}/ and are
# row-aligned with processed/tessera_global/station_list_filtered.csv.
# ==========================================================================

# ---- crop64, lat16 ----
- name: t2m_snap_vae_crop64_lat16_auxon_concat_mtpi
  label: "t2m VAE crop64-lat16 auxon concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#1f77b4"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat16_grad0.5_auxon.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_vae_crop64_lat16_auxon_concat_mtpi
  label: "Wind (TruncNormal) VAE crop64-lat16 auxon concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#1f77b4"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat16_grad0.5_auxon.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"

- name: t2m_snap_vae_crop64_lat16_auxoff_concat_mtpi
  label: "t2m VAE crop64-lat16 auxoff concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#ff7f0e"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat16_grad0.5_auxoff.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_vae_crop64_lat16_auxoff_concat_mtpi
  label: "Wind (TruncNormal) VAE crop64-lat16 auxoff concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#ff7f0e"
  target_variables: [wind]
