# =========================================================================
# EXTRA DESCRIPTORS on the shortlisted variant (crop64_lat16_auxon), added
# 2026-07-26. Hand-crafted surface/topography descriptors after Bakketun
# et al. 2026 (arXiv:2607.02824), 17 dims, concatenated with the VAE
# latents by train.py (both flags passed; derived cache + z-score stats
# pre-built by concat_station_vectors.py so concurrent jobs only read).
# Pairs with the identically-named crop64_lat16_auxon entry above (same
# latents, same station set) and with the baseline / baseline+extradesc
# arms in the sibling snapshot_14y_<region> folder, forming the 2x2:
#   {baseline, TESSERA} x {without, with extra descriptors}.
# =========================================================================

- name: t2m_snap_vae_crop64_lat16_auxon_extradesc_concat_mtpi
  label: "t2m VAE crop64-lat16 auxon + extra descriptors concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#e377c2"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${VAE_LATENTS_DIR}/station_latents_${TESSERA_VARIANT}_p128_${EMBED_YEAR}_crop64_lat16_grad0.5_auxon.npy --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --extra-descriptors-path ${EXTRA_DESCRIPTORS_PATH} --extra-descriptors-station-csv ${VAE_LATENTS_CSV} --no-static-fields --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_vae_crop64_lat16_auxon_extradesc_concat_mtpi
  label: "Wind (TruncNormal) VAE crop64-lat16 auxon + extra descriptors concat (elev + mTPI, no static, wd=1e-4)"
