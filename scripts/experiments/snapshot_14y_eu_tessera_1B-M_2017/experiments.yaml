# =========================================================================
# PATCH SUMMARY-STATISTICS control on the shortlisted variant
# (crop64_lat16_auxon) — paper Appendix A. Replaces the learnt VAE patch
# encoder with 16 hand-crafted statistics over the SAME central 64x64
# (~640 m) window of the same ${TESSERA_VARIANT} ${EMBED_YEAR} patches:
# top-4 channels by cross-train-station variance x {mean, std, p10, p90}
# (build_summary_stats_latents.py --center-crop 64; NaN-mask aligned to the
# crop64_lat16_auxon latents so the station set matches the live and
# shuffled arms). Identical architecture and parameter count to the lat16
# arms — only the content of the 16-d per-station vector changes.
# =========================================================================

- name: t2m_snap_stats16_crop64_concat_mtpi
  label: "t2m patch summary-stats 16-d crop64 concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#9467bd"
  target_variables: [t2m]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${SUMMARY_STATS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --use-mtpi --weight-decay 1e-4"

- name: wind_truncnormal_snap_stats16_crop64_concat_mtpi
  label: "Wind (TruncNormal) patch summary-stats 16-d crop64 concat (elev + mTPI, no static, wd=1e-4)"
  colour: "#9467bd"
  target_variables: [wind]
  extra_args: "--interpolation bilinear --tessera-injection concat --vae-latents-path ${SUMMARY_STATS_PATH} --vae-latents-station-csv ${VAE_LATENTS_CSV} --vae-latents-drop-prob 0.0 --no-static-fields --use-mtpi --weight-decay 1e-4 --likelihood wind=truncated_normal"
