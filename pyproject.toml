[project]
name = "tessera-downscaling"
version = "0.1.0"
description = "Probabilistic weather downscaling with a ConvCNP conditioned on TESSERA Earth-observation embeddings"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pedro Sousa" }]

# Pinned to the versions the paper's runs used (monorepo lockfile, Aug 2026).
dependencies = [
    "torch==2.9.0",
    "numpy==2.3.4",
    "pandas>=3.0.1",
    "scipy>=1.17",
    "scikit-learn>=1.8",
    "matplotlib==3.10.7",
    "cartopy==0.25.0",
    "xarray==2025.9.0",
    "netcdf4==1.7.2",
    "h5netcdf==1.8.0",
    "h5py==3.15.1",
    "zarr==2.18.7",
    "pyyaml>=6.0",
    "tqdm==4.67.1",
    "rasterio>=1.5",
    "geotessera>=0.7.5",
    "python-dateutil>=2.9",
    "urllib3>=2",
]

[project.scripts]
tessera-train = "tessera_downscaling.train:main"
tessera-evaluate = "tessera_downscaling.evaluate:main"
tessera-baselines = "tessera_downscaling.baselines:main"

[project.optional-dependencies]
# Data ingestion (WeatherBench2 / ARCO-ERA5 on GCS, GHCNh, Earth Engine, CDS).
ingest = [
    "gcsfs>=2026.3.0",
    "google-cloud-storage>=2.0",
    "earthengine-api>=1.0",
    "ecmwf-datastores-client>=0.2",
]
# Aurora forecast generation (scripts/aurora); heavy, keep out of the default env.
aurora = ["microsoft-aurora==1.8.0"]
notebooks = ["ipykernel", "nbformat", "jupyter"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff==0.12.2",
    "pre-commit>=4.2.0",
    "nbstripout>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_downscaling"]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
# Correctness and consistency rules that pre-commit enforces: pyflakes,
# pycodestyle, isort, bugbear, pyupgrade. Line length is left to the formatter.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "W505"]

[tool.ruff.lint.isort]
known-first-party = ["tessera_downscaling"]
